name: Skill zips

# Zips every skill for uploading to claude.ai and puts them on the "latest" release.
on:
  push:
    branches: [main]
    paths: ['skills/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir dist
          cd skills
          for d in */; do n="${d%/}"; zip -qr "../dist/$n.zip" "$n"; done
      - name: Upload to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest skills" \
            --notes "One zip per skill, rebuilt on every push. Upload at claude.ai: Settings > Capabilities > Skills."
          gh release upload latest dist/*.zip --clobber
